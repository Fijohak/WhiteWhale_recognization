name: whitewhale-platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-whitewhale}
      POSTGRES_USER: ${POSTGRES_USER:-whitewhale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
    volumes:
      - ${WHITEWHALE_POSTGRES_ROOT:-/srv/whitewhale/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [control]

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      WHITEWHALE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-whitewhale}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-whitewhale}
      WHITEWHALE_DATA_ROOT: /srv/whitewhale/data
      WHITEWHALE_REQUIRE_ACTIVE_CATALOG: ${WHITEWHALE_REQUIRE_ACTIVE_CATALOG:-false}
    volumes:
      - ${WHITEWHALE_DATA_ROOT:-/srv/whitewhale/data}:/srv/whitewhale/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [control]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    environment:
      WHITEWHALE_HTTPS_SITE: ${WHITEWHALE_HTTPS_SITE:-https://localhost}
    ports:
      - "${WHITEWHALE_HTTPS_PORT:-443}:443"
      - "127.0.0.1:${WHITEWHALE_TAILSCALE_UPSTREAM_PORT:-8080}:8080"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [control]

networks:
  control:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
