<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>
  <g id="header" data-pptx-bounds="0 0 1280 90">
    <rect x="0" y="0" width="1280" height="90" fill="#1E3A5F"/>
    <rect x="0" y="0" width="10" height="90" fill="#E8B339"/>
    <text x="70" y="56" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="bold" fill="#FFFFFF">迁移学习 — 外部数据源与执行顺序</text>
  </g>
  <g id="sources" data-pptx-bounds="70 130 560 400">
    <text x="90" y="176" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#1E3A5F">外部数据源（P0 优先）</text>
    <rect x="90" y="196" width="540" height="62" rx="8" fill="#F2F5F9"/>
    <text x="110" y="226" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="bold" fill="#1E3A5F">Happywhale</text>
    <text x="110" y="250" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#2B3440">5.1 万张 / 1.56 万个体 / 30 物种（监督 Re-ID）</text>
    <rect x="90" y="270" width="540" height="62" rx="8" fill="#F2F5F9"/>
    <text x="110" y="300" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="bold" fill="#1E3A5F">NDD20</text>
    <text x="110" y="324" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#2B3440">4402 张，背鳍识别 + 部分分割标注（CC BY-NC-SA）</text>
    <rect x="90" y="344" width="540" height="62" rx="8" fill="#F2F5F9"/>
    <text x="110" y="374" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="bold" fill="#1E3A5F">NOAA 宽吻海豚</text>
    <text x="110" y="398" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#2B3440">188 个体，背鳍形态 / 缺口（shape 预训练）</text>
    <rect x="90" y="418" width="540" height="62" rx="8" fill="#F2F5F9"/>
    <text x="110" y="448" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="bold" fill="#1E3A5F">Beluga ID</text>
    <text x="110" y="472" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#2B3440">5902 张 / 788 个体，疤痕 / 纹理（texture 路线）</text>
  </g>
  <g id="risk" data-pptx-bounds="660 130 560 170">
    <rect x="660" y="130" width="560" height="170" rx="8" fill="#F2F5F9"/>
    <rect x="660" y="130" width="10" height="170" fill="#BF0000"/>
    <text x="700" y="178" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#BF0000">最大风险：负迁移</text>
    <text x="700" y="218" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#2B3440">源域靠背鳍轮廓识别，目标域靠斑点 / 色素纹理区分</text>
    <text x="700" y="252" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#2B3440">直接分类迁移可能让模型过度依赖 shape、忽略 texture</text>
    <text x="700" y="286" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#BF0000">→ 用消融实验验证迁移是否真有效</text>
  </g>
  <g id="order" data-pptx-bounds="660 320 560 210">
    <rect x="660" y="320" width="560" height="210" rx="8" fill="#F2F5F9"/>
    <rect x="660" y="320" width="10" height="210" fill="#E8B339"/>
    <text x="700" y="368" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#1E3A5F">执行顺序（规模从小到大）</text>
    <text x="700" y="412" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#2B3440">1. NDD20 → 2. NOAA → 3. Beluga</text>
    <text x="700" y="446" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#2B3440">4. Happywhale → 5. 多源融合</text>
    <text x="700" y="492" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#666666">优先小数据跑通 pipeline，再上大数据验证收益</text>
  </g>
  <g id="footer" data-pptx-bounds="60 660 1160 30">
    <text x="70" y="684" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#666666">技术方向</text>
    <text x="1200" y="684" text-anchor="end" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#666666">8 / 12</text>
  </g>
</svg>
