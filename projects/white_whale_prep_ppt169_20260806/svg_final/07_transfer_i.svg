<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background" />
  <g id="header" data-pptx-bounds="0 0 1280 90">
    <rect x="0" y="0" width="1280" height="90" fill="#1E3A5F" />
    <rect x="0" y="0" width="10" height="90" fill="#E8B339" />
    <text x="70" y="56" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="bold" fill="#FFFFFF">迁移学习 — 四组对照实验</text>
  </g>
  <g id="exp-a" data-pptx-bounds="70 130 270 160">
    <rect x="70" y="130" width="270" height="160" rx="8" fill="#F2F5F9" />
    <rect x="70" y="130" width="270" height="8" fill="#1E3A5F" />
    <text x="100" y="182" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="bold" fill="#1E3A5F">A</text>
    <text x="100" y="218" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#1E3A5F">基线</text>
    <text font-size="15" font-family="Microsoft YaHei, sans-serif" fill="#2B3440" x="100" y="252">ImageNet / DINOv2 / MegaDescriptor</text><text font-size="15" font-family="Microsoft YaHei, sans-serif" fill="#2B3440" x="100" y="278">预训练 + 本地</text></g>
  <g id="exp-b" data-pptx-bounds="360 130 270 160">
    <rect x="360" y="130" width="270" height="160" rx="8" fill="#F2F5F9" />
    <rect x="360" y="130" width="270" height="8" fill="#E8B339" />
    <text x="390" y="182" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="bold" fill="#1E3A5F">B</text>
    <text x="390" y="218" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#1E3A5F">鲸豚监督迁移</text>
    <text x="390" y="252" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#2B3440">Happywhale 监督预训练 + 本地</text>
  </g>
  <g id="exp-c" data-pptx-bounds="650 130 270 160">
    <rect x="650" y="130" width="270" height="160" rx="8" fill="#F2F5F9" />
    <rect x="650" y="130" width="270" height="8" fill="#E8B339" />
    <text x="680" y="182" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="bold" fill="#1E3A5F">C</text>
    <text x="680" y="218" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#1E3A5F">自监督鲸豚迁移</text>
    <text font-size="15" font-family="Microsoft YaHei, sans-serif" fill="#2B3440" x="680" y="252">Happywhale / NDD20</text><text font-size="15" font-family="Microsoft YaHei, sans-serif" fill="#2B3440" x="680" y="278">self-supervised + 本地</text></g>
  <g id="exp-d" data-pptx-bounds="940 130 270 160">
    <rect x="940" y="130" width="270" height="160" rx="8" fill="#F2F5F9" />
    <rect x="940" y="130" width="270" height="8" fill="#BF0000" />
    <text x="970" y="182" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="bold" fill="#BF0000">D</text>
    <text x="970" y="218" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#BF0000">多源鲸豚</text>
    <text font-size="15" font-family="Microsoft YaHei, sans-serif" fill="#2B3440" x="970" y="252">Happywhale + NDD20 + NOAA</text><text font-size="15" font-family="Microsoft YaHei, sans-serif" fill="#2B3440" x="970" y="278">+ Beluga + 本地</text></g>
  <g id="verdict" data-pptx-bounds="70 320 1140 160">
    <rect x="70" y="320" width="1140" height="160" rx="8" fill="#F2F5F9" />
    <rect x="70" y="320" width="10" height="160" fill="#BF0000" />
    <text x="110" y="368" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#1E3A5F">判定标准</text>
    <text x="110" y="412" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#2B3440">C / B 优于 A → 迁移有效，外部鲸豚数据有价值</text>
    <text x="110" y="446" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#BF0000">C 低于 B → 存在 source cue bias / 负迁移，改用多源或自监督</text>
  </g>
  <g id="takeaway" data-pptx-bounds="70 510 1140 110">
    <rect x="70" y="510" width="1140" height="110" rx="8" fill="#1E3A5F" />
    <text x="100" y="554" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="bold" fill="#E8B339">执行顺序 A → B → D → C · 核心判断</text>
    <text x="100" y="590" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#FFFFFF">迁移的是 cetacean dorsal-fin representation（通用鲸豚背鳍表示），不是源物种的个体分类规则</text>
  </g>
  <g id="footer" data-pptx-bounds="60 660 1160 30">
    <text x="70" y="684" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#666666">技术方向</text>
    <text x="1200" y="684" text-anchor="end" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#666666">7 / 12</text>
  </g>
</svg>