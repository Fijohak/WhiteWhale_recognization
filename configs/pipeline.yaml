# 管线统一配置（run_pipeline / launch_review / launch_query / prepare_data / run_cross_time_batch 共用）
# 所有路径相对仓库根；I:/ 等数据盘只在这里出现一次。

data_root: I:/                                # 原图根目录（只读，含 01/ 03/ 等）
data_roots:                                   # prepare_data scan 的扫描根（默认 data_root/{01,03}）
  - I:/01
  - I:/03
output_root: outputs
detector_checkpoint: models/detectors/yolov8n_dorsalfin.pt   # YOLO 背鳍检测器（E1）
reid_checkpoint: outputs/metric_learning/r3/best.pt          # r3 跨群 HN 微调权重（正式特征源）

crop:                                          # 检测框非均匀扩展（E2 标定）
  pad_x: 0.30
  pad_up: 0.15
  pad_down: 0.60

clustering:                                    # HDBSCAN 候选聚类（批内）
  min_cluster_size: 3
  subcluster_min_size: 4

retrieval:                                     # 簇级多帧投票匹配（实验标定参考值）
  threshold_cluster: 0.58                      # E5 簇级 FA≤5%
  threshold_image: 0.50                        # E4 单图区间下限
  topk: 3

review:                                        # launch_review
  port: 8001
  host: 127.0.0.1

query:                                         # launch_query（gallery = r3+YOLO 裁剪特征）
  embeddings: embeddings/embeddings_metric_r3_yolocrop.npy
  meta: embeddings/embeddings_metric_r3_yolocrop_meta.csv
  pilot: pilot/pilot_set.csv
  threshold: 0.55                              # 三态判定（E4 标定 FA≤5% 区间中值）
  k: 10
  port: 8000
  host: 127.0.0.1
