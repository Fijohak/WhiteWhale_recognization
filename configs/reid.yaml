# ReID 训练配置（scripts/train_reid.py 默认值，CLI 可覆盖）
# 两阶段训练：冻结 backbone 训 head → 解冻低学习率微调
# HN 已修正为同 session 已确认负样本的 batch-hard；版本目录必须由 CLI 显式指定

val_n: 6                 # 验证个体数（按个体留出，同一体不跨 train/val）
seed: 42
test_sessions: []         # 独立测试批次；默认不启用，CLI 用 --test-session 可重复指定
epochs_stage1: 20        # 阶段一：冻结 backbone 训 head
epochs_stage2: 25        # 阶段二：解冻微调
lr_head: 0.001
lr_backbone: 0.000005
batch: 16

# 批内 hard negative
hard_negative: true      # false = 纯 ArcFace CE
batches_per_epoch: 40    # 同 session 身份均衡 batch 数
lambda_hn: 0.2           # 历史超参参考值；候选模型须独立消融验证
