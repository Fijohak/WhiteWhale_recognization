<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中华白海豚个体识别 · 检索工具</title>
<style>
  :root { --ink:#1c2733; --accent:#1e3a5f; --accent2:#2c5282; --line:#d8dee6;
          --bg:#fafbfc; --card:#ffffff; --muted:#5b6b7b; --ok:#1a7f4b;
          --warn:#9a6b1a; --warnbg:#fbf3e0; --okbg:#e8f5ee; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Georgia","Times New Roman","SimSun",serif;
         background:var(--bg); color:var(--ink); line-height:1.6; }
  header { background:var(--accent); color:#fff; padding:18px 28px;
           border-bottom:3px solid var(--accent2); }
  header h1 { font-size:19px; font-weight:600; letter-spacing:.5px; }
  header .sub { font-size:12px; opacity:.82; margin-top:3px; font-family:"Segoe UI","Microsoft YaHei",sans-serif; }
  .wrap { max-width:980px; margin:22px auto; padding:0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:4px;
          padding:18px 22px; margin-bottom:18px; box-shadow:0 1px 2px rgba(28,39,51,.04); }
  .card h2 { font-size:13px; color:var(--accent2); font-weight:600; letter-spacing:1px;
             border-left:3px solid var(--accent2); padding-left:8px; margin-bottom:12px; }
  .drop { border:1.5px dashed #b6c2cf; border-radius:4px; padding:26px; text-align:center;
          cursor:pointer; transition:border-color .2s, background .2s; }
  .drop:hover, .drop.drag { border-color:var(--accent2); background:#f4f8fc; }
  .drop p { color:var(--muted); font-size:13px; }
  #fileInput { display:none; }
  .btn { background:var(--accent2); color:#fff; border:none; padding:7px 20px;
         border-radius:3px; font-size:13px; cursor:pointer; letter-spacing:1px; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .preview-row { display:flex; align-items:flex-start; gap:18px; margin-top:12px; }
  .preview-row img { max-width:170px; max-height:130px; border:1px solid var(--line); border-radius:3px; }
  .banner { padding:10px 14px; border-radius:3px; font-size:14px; font-weight:600; margin-bottom:14px; }
  .banner.known { background:var(--okbg); color:var(--ok); border-left:4px solid var(--ok); }
  .banner.unknown { background:var(--warnbg); color:var(--warn); border-left:4px solid var(--warn); }
  .banner small { display:block; font-weight:400; margin-top:4px; font-family:"Segoe UI","Microsoft YaHei",sans-serif; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(152px,1fr)); gap:12px; }
  .cand { border:1px solid var(--line); border-radius:3px; overflow:hidden; background:#fff; }
  .cand img { width:100%; height:112px; object-fit:cover; display:block; }
  .cand .meta { padding:7px 9px; font-size:12px; font-family:"Segoe UI","Microsoft YaHei",sans-serif; }
  .cand .rank { font-weight:700; color:var(--accent); }
  .cand .score { float:right; color:var(--muted); }
  .cand .score.hot { color:var(--ok); font-weight:700; }
  .cand .tag { display:inline-block; margin:2px 2px 0 0; padding:1px 5px; border-radius:2px;
               background:#eef1f5; color:var(--muted); font-size:10px; }
  .cand .tag.src { background:#eef4fa; color:var(--accent2); }
  .bar { height:3px; background:var(--line); border-radius:2px; margin-top:5px; }
  .bar > div { height:100%; border-radius:2px; background:var(--accent2); }
  #status { font-size:12px; color:var(--muted); margin-top:8px;
            font-family:"Segoe UI","Microsoft YaHei",sans-serif; }
  .err { color:#b02525; font-size:12px; margin-top:6px; }
  footer { max-width:980px; margin:8px auto 26px; padding:0 20px; color:var(--muted);
           font-size:11px; font-family:"Segoe UI","Microsoft YaHei",sans-serif; }
  footer .rule { border-top:1px solid var(--line); padding-top:8px; line-height:1.8; }
</style>
</head>
<body>
<header>
  <h1>中华白海豚个体识别检索工具</h1>
  <div class="sub">本地离线运行 · 上传照片 → 特征检索 → Top-K 候选 · 输出仅为候选，人工核验后方为确认个体</div>
</header>

<div class="wrap">
  <div class="card">
    <h2>查询图</h2>
    <div class="drop" id="dropZone">
      <p>点击选择或拖拽图片到此处<br><small style="color:#94a3b8">支持 JPG / PNG</small></p>
    </div>
    <input type="file" id="fileInput" accept="image/*">
    <div class="preview-row" id="previewRow" style="display:none">
      <img id="previewImg" alt="查询图">
      <div>
        <button class="btn" id="btnQuery" disabled>开始检索</button>
        <div id="status"></div>
        <div class="err" id="err"></div>
      </div>
    </div>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <h2>检索结果</h2>
    <div id="resultBox"></div>
  </div>
</div>

<footer>
  <div class="rule">
    说明：目录名（源组）与候选簇均为弱信息 / 候选分组，不代表正式个体 ID；
    当前 known/unknown 阈值尚未完成独立开放集标定，只能作为候选提示；所有候选必须人工核验。
    数据可追溯：image_id / 源组 / 会话 / 质量带。
  </div>
</footer>

<script>
const drop = document.getElementById('dropZone');
const input = document.getElementById('fileInput');
const previewRow = document.getElementById('previewRow');
const previewImg = document.getElementById('previewImg');
const btnQuery = document.getElementById('btnQuery');
const statusEl = document.getElementById('status');
const errEl = document.getElementById('err');
const resultCard = document.getElementById('resultCard');
const resultBox = document.getElementById('resultBox');

let selectedFile = null;

drop.addEventListener('click', () => input.click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag'); });
drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('drag');
  if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
});
input.addEventListener('change', () => { if (input.files.length) setFile(input.files[0]); });

function setFile(f) {
  selectedFile = f;
  previewImg.src = URL.createObjectURL(f);
  previewRow.style.display = 'flex';
  btnQuery.disabled = false;
  statusEl.textContent = '已选：' + f.name;
  errEl.textContent = '';
}

btnQuery.addEventListener('click', async () => {
  if (!selectedFile) return;
  btnQuery.disabled = true;
  statusEl.textContent = '提取特征并检索中…';
  errEl.textContent = '';
  const fd = new FormData();
  fd.append('file', selectedFile);
  try {
    const resp = await fetch('/api/query', { method: 'POST', body: fd });
    const data = await resp.json();
    if (data.error) { errEl.textContent = data.error; btnQuery.disabled = false; statusEl.textContent = ''; return; }
    render(data);
  } catch (e) {
    errEl.textContent = '请求失败：' + e;
  }
  btnQuery.disabled = false;
  statusEl.textContent = '完成';
});

function render(data) {
  resultCard.style.display = 'block';
  const banner = data.status === 'known'
    ? `<div class="banner known">找到候选 · 最高相似度 ${data.max_score.toFixed(3)}（阈值 ${data.threshold}）
        <small>以下为 Top-${data.candidates.length} 候选，仍需人工核验后方可确认为个体</small></div>`
    : `<div class="banner unknown">疑似未知个体 · 最高相似度 ${data.max_score.toFixed(3)} &lt; 阈值 ${data.threshold}
        <small>可能为图库中未收录的新个体。以下候选仅供参考，请勿自动合并。</small></div>`;

  const cards = data.candidates.map(c => {
    const hot = c.score >= data.threshold ? 'hot' : '';
    const pct = Math.round(c.score * 100);
    return `<div class="cand">
      <img src="/api/image/${encodeURIComponent(c.image_id)}" alt="${c.image_id}" loading="lazy">
      <div class="meta">
        <span class="rank">#${c.rank}</span>
        <span class="score ${hot}">${c.score.toFixed(3)}</span>
        <div class="bar"><div style="width:${pct}%"></div></div>
        <div>
          ${c.source_group ? `<span class="tag src">源组 ${c.source_group}</span>` : ''}
          ${c.session_id ? `<span class="tag">会话 ${c.session_id}</span>` : ''}
          ${c.quality_band ? `<span class="tag">质量 ${c.quality_band}</span>` : ''}
          ${c.cluster !== '' && c.cluster !== '-1' ? `<span class="tag">候选簇 ${c.cluster}</span>` : ''}
          ${c.cluster === '-1' ? `<span class="tag">噪声</span>` : ''}
        </div>
        <div style="font-size:10px;color:#94a3b8;word-break:break-all;margin-top:3px">${c.image_id}</div>
      </div>
    </div>`;
  }).join('');

  resultBox.innerHTML = banner + `<div class="grid">${cards}</div>`
    + `<p style="font-size:11px;color:#b45309;margin-top:12px">⚠ ${esc(data.threshold_warning)}</p>`
    + `<p style="font-size:11px;color:var(--muted);margin-top:6px">图库规模：${data.n_gallery} 张 · 候选提示阈值：${data.threshold}</p>`;
}
</script>
</body>
</html>
